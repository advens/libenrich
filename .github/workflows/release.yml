name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfastjson-dev pkg-config

      - name: build and test
        run: make test

      - name: source tarball
        run: |
          v="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="libenrich-${v}/" -o "libenrich-${v}.tar.gz" "${GITHUB_REF_NAME}"
          sha256sum "libenrich-${v}.tar.gz" > "libenrich-${v}.tar.gz.sha256"

      - name: changelog section
        run: |
          v="${GITHUB_REF_NAME}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > RELEASE_NOTES.md

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME}"
          gh release create "$v" \
            "libenrich-${v}.tar.gz" \
            "libenrich-${v}.tar.gz.sha256" \
            --title "$v" \
            --notes-file RELEASE_NOTES.md
